[project]
name = "ai-simulations"
version = "2.0.0"
description = "Two reinforcement-learning simulations that learn from scratch: self-driving race cars (DQN) and 3D humanoids that learn to walk and run (PPO, MuJoCo)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MrYaho" }]
keywords = ["reinforcement-learning", "ppo", "dqn", "mujoco", "pygame", "humanoid", "locomotion", "self-driving"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "pygame>=2.5",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.1",
    "mujoco>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:pygame.*"]

[tool.coverage.run]
source = ["racing", "walker", "common"]
omit = [
    # Pencere/çizim katmanı: ekran görüntüleri ve duman testleriyle doğrulanır
    "racing/app.py", "racing/ui.py", "racing/hud.py", "racing/render.py", "racing/picker.py",
    "walker/app.py", "walker/hud.py", "common/*",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Türkçe metinlerdeki tipografik karakterler (·, ×, −, →) bilinçli
    "B905",                        # zip(strict=...) — dizi boyları zaten yapı gereği eşit
    "RUF005",                      # (liste + [öğe])[-N:] kalıbı okunaklı
    "RUF046",                      # int(round(x)) bilinçli
]

[tool.ruff.lint.per-file-ignores]
"walker/model.py" = ["E501"]   # MJCF (XML) şablon satırları bölünmeden daha okunaklı

[tool.ruff.lint.flake8-bugbear]
# Değişmez (frozen) yapılandırma nesneleri varsayılan argüman olarak güvenle kullanılabilir.
extend-immutable-calls = ["walker.ppo.PPOConfig", "walker.PPOConfig"]

[tool.ruff.lint.isort]
known-first-party = ["racing", "walker", "common"]
